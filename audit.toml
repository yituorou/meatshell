# cargo-audit configuration (https://rustsec.org).
#
# RUSTSEC-2026-0154 (russh "unbounded 32-bit allocation" DoS in SSH-agent frame
# parsing, russh < 0.60.3) is fixed: meatshell is on russh 0.61. SSH-agent
# login (#528) still uses meatshell's own minimal agent client
# (src/ssh/impls/agent.rs) with the same 256 KiB frame cap.
#
# russh 0.61 depends on release-candidate crypto crates (ssh-key 0.7.0-rc,
# rsa 0.10.0-rc, ed25519-dalek 3.0.0-rc, p256 0.14.0-rc, ...). Move to the final
# releases as soon as russh does.
[advisories]
ignore = []
